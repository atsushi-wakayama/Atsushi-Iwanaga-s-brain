<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>政策のいま｜岩永淳志</title>
<meta name="description" content="和歌山県議会議員・岩永淳志が地域の声から拾い上げた政策課題の一覧。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* --- トンマナ --- */
  --bg:#ffffff;
  --ink:#1d2b27;            /* 本文 */
  --green:#14624a;          /* メインカラー：深みのあるグリーン */
  --green-d:#0d4433;
  --green-l:#e9f3ef;        /* 薄い緑の面 */
  --muted:#71817b;
  --line:#e3e9e6;
  --band:linear-gradient(90deg,#cfeadb 0%,#d8eeea 45%,#d6e7f6 100%); /* 薄緑〜水色の帯 */
  --round:linear-gradient(135deg,#2f9070 0%,#14624a 60%,#0d4433 100%); /* 丸ボタン */
  --card-r:20px;
  --ease:cubic-bezier(.22,.9,.24,1);
  --serif:"Noto Serif JP",serif;
  --sans:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-weight:400;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;font-family:var(--sans)}

/* ページ最上部のグラデーションの帯 */
#topband{position:fixed;top:0;left:0;right:0;height:5px;background:var(--band);z-index:70}

/* ---------- 無限グリッド ---------- */
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:var(--bg)}
#stage.dragging{cursor:grabbing}
#stage::before,#stage::after{content:"";position:absolute;left:0;right:0;height:150px;z-index:5;pointer-events:none}
#stage::before{top:0;background:linear-gradient(to bottom,#fff 14%,rgba(255,255,255,.8) 48%,rgba(255,255,255,0))}
#stage::after{bottom:0;background:linear-gradient(to top,#fff 12%,rgba(255,255,255,.8) 48%,rgba(255,255,255,0))}
#grid{position:absolute;inset:0;will-change:transform}

/* カードの色分けは従来どおり（テーマごとの色を維持） */
.card{
  position:absolute;top:0;left:0;
  border-radius:var(--card-r);overflow:hidden;background:#f1f4f2;
  box-shadow:0 14px 34px rgba(15,60,46,.16), 0 2px 6px rgba(15,60,46,.08);
  transition:opacity .45s var(--ease), filter .45s var(--ease), box-shadow .35s var(--ease);
  will-change:transform;user-select:none;-webkit-user-select:none;cursor:pointer;
}
.card__inner{position:absolute;inset:0;transition:transform .6s var(--ease);transform:scale(1)}
.card:hover{box-shadow:0 22px 48px rgba(15,60,46,.24)}
.card:hover .card__inner{transform:scale(1.06)}
.card__bg{position:absolute;inset:0;background-size:cover;background-position:center}
.card__glyph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:900;
  font-size:clamp(80px,14vw,190px);line-height:1;
  color:rgba(255,255,255,.13);letter-spacing:-.04em;
}
.card__shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,26,20,.88) 0%,rgba(6,26,20,.38) 45%,rgba(6,26,20,0) 78%)}
.card__body{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 16px;color:#fff}
.card__sub{font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.72);margin:0 0 6px}
.card__title{
  font-family:var(--serif);font-weight:700;
  font-size:22px;line-height:1.32;margin:0 0 10px;letter-spacing:.02em;
  text-shadow:0 2px 12px rgba(0,0,0,.45);
}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{
  font-size:10.5px;line-height:1;padding:5px 10px;border-radius:999px;
  background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(6px);white-space:nowrap;
}
.card__status{
  position:absolute;top:12px;left:12px;font-size:10.5px;letter-spacing:.08em;
  padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.94);
  color:var(--green-d);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.18);
}
.card.is-dim{opacity:.2;filter:grayscale(1)}
.card.is-mute{opacity:.3}
.card.is-peek{box-shadow:0 0 0 3px var(--green), 0 22px 48px rgba(15,60,46,.28)}
.card.is-peek .card__inner{transform:scale(1.06)}

/* ---------- ヘッダ / UI ---------- */
.ui{position:fixed;z-index:20;pointer-events:none}
.ui > *{pointer-events:auto}
#brand{top:0;left:0;padding:30px 34px}
#brand .logo{
  font-family:var(--serif);font-weight:900;font-size:30px;letter-spacing:.06em;
  margin:0;line-height:1.15;color:var(--green-d);
}
#brand .logo small{
  display:block;font-family:var(--sans);font-size:11px;color:var(--muted);
  letter-spacing:.2em;margin-top:8px;font-weight:500;
}
#brand .lead{max-width:330px;margin:16px 0 0;font-size:12.5px;line-height:1.95;color:var(--muted)}

/* ナビゲーション：緑のアンダーライン */
#nav{top:0;right:0;padding:34px 34px;display:flex;gap:26px;font-size:12.5px;letter-spacing:.12em;font-weight:500}
#nav a{position:relative;color:var(--ink);text-decoration:none;padding-bottom:6px}
#nav a::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--green);
  transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease);
}
#nav a:hover{color:var(--green)}
#nav a:hover::after{transform:scaleX(1)}

#hint{
  top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:.08em;
  color:var(--green-d);text-align:center;line-height:1.4;
  padding:26px 44px 24px;border-radius:26px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  box-shadow:0 14px 40px rgba(15,60,46,.16);
  transition:opacity .6s var(--ease);pointer-events:none!important;
}
#hint::after{content:"";display:block;width:52px;height:2px;background:var(--band);margin:14px auto 0}
#hint.hide{opacity:0}

#dock{
  left:50%;bottom:28px;transform:translateX(-50%);
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:999px;padding:9px 12px 9px 22px;
  box-shadow:0 12px 34px rgba(15,60,46,.14);max-width:calc(100vw - 32px);
}
#dock .label{font-size:12px;color:var(--muted);white-space:nowrap;letter-spacing:.08em}
/* 角丸のピル型ボタン */
.pill{
  font-size:12.5px;padding:9px 17px;border-radius:999px;color:var(--ink);
  background:#fff;border:1px solid var(--line);transition:all .22s var(--ease);white-space:nowrap;
}
.pill:hover{background:var(--green-l);border-color:#c9dfd6;color:var(--green-d)}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}
#filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px}
#filters::-webkit-scrollbar{display:none}

#listbtn{
  left:0;bottom:28px;padding-left:34px;display:flex;align-items:center;gap:10px;
  font-size:12.5px;letter-spacing:.1em;color:var(--green-d);font-weight:500;
}
#listbtn .bars{display:grid;gap:3px}
#listbtn .bars i{display:block;width:16px;height:2px;background:var(--green)}
#listbtn:hover{color:var(--green)}
#foot{right:0;bottom:28px;padding-right:34px;font-size:11px;color:var(--muted)}

/* ---------- 丸いグラデーションボタン ---------- */
.btn-round{
  display:inline-flex;align-items:center;justify-content:center;
  width:46px;height:46px;border-radius:50%;flex:none;
  background:var(--round);color:#fff;font-size:15px;
  box-shadow:0 8px 18px rgba(20,98,74,.32);
  transition:transform .3s var(--ease), box-shadow .3s var(--ease);
}

/* ---------- クリック1回目：概要ポップアップ ---------- */
#peek{
  position:fixed;z-index:30;width:340px;max-width:calc(100vw - 32px);
  background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:0 0 18px;overflow:hidden;
  box-shadow:0 26px 60px rgba(15,60,46,.22);
  opacity:0;transform:translateY(10px) scale(.97);pointer-events:none;
  transition:opacity .28s var(--ease), transform .28s var(--ease);cursor:pointer;
}
#peek.on{opacity:1;transform:none;pointer-events:auto}
#peek .pband{height:5px;background:var(--band)}   /* グラデーションの帯 */
#peek .pin{padding:20px 22px 0}
#peek .psub{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:0 0 7px}
#peek .ptitle{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.35;margin:0 0 12px;color:var(--green-d)}
#peek .ptext{font-size:13px;line-height:2;color:var(--ink);margin:0 0 14px}
#peek .tags{margin-bottom:16px}
#peek .tag{background:var(--green-l);color:var(--green-d);border-color:#d5e7df;backdrop-filter:none}
#peek .pmore{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-top:1px solid var(--line);margin:0 22px;padding-top:14px;
}
#peek .pmore .ptxt{font-size:11.5px;letter-spacing:.08em;color:var(--green);font-weight:700}
#peek .pmore em{display:block;font-style:normal;color:var(--muted);font-size:10.5px;letter-spacing:.06em;margin-top:5px;font-weight:400}
#peek:hover .btn-round{transform:translateX(4px);box-shadow:0 12px 24px rgba(20,98,74,.4)}
@media (max-width:760px){
  #peek{left:16px!important;right:16px!important;width:auto;bottom:88px!important;top:auto!important}
}

/* ---------- 詳細（サブページ） ---------- */
#detail{position:fixed;inset:0;z-index:40;visibility:hidden}
#detail.open{visibility:visible}
#detail .veil{position:absolute;inset:0;background:var(--bg);opacity:0;transition:opacity .5s var(--ease)}
#detail.open .veil{opacity:1}

#hero{
  position:absolute;border-radius:var(--card-r);overflow:hidden;
  transition:transform .72s var(--ease), border-radius .72s var(--ease), width .72s var(--ease), height .72s var(--ease), top .72s var(--ease), left .72s var(--ease);
}
#hero .hbg{position:absolute;inset:0;background-size:cover;background-position:center}
#hero .hshade{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,26,20,.92),rgba(6,26,20,.3) 60%,rgba(6,26,20,.5))}
#hero .hglyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:clamp(120px,26vw,380px);color:rgba(255,255,255,.11);line-height:1}

#detailScroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;opacity:0;transition:opacity .45s var(--ease) .18s}
#detail.open #detailScroll{opacity:1}
.dhead{min-height:56vh;display:flex;align-items:flex-end;padding:0 clamp(24px,7vw,110px) clamp(28px,5vh,54px);position:relative;color:#fff}
.dhead .in{max-width:960px;transform:translateY(18px);opacity:0;transition:all .6s var(--ease) .22s}
#detail.open .dhead .in{transform:none;opacity:1}
.dhead h1{font-family:var(--serif);font-weight:900;font-size:clamp(32px,6vw,70px);line-height:1.24;margin:12px 0 16px;letter-spacing:.02em}
.dhead .sub{font-size:clamp(12.5px,1.5vw,16px);color:rgba(255,255,255,.85);letter-spacing:.1em;margin:0}
.dhead .tags{margin-top:18px}

.dbody{background:var(--bg);padding:clamp(46px,7vw,92px) clamp(24px,7vw,110px) 150px;position:relative}
.dbody::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--band)}
.dbody .wrap{max-width:820px;margin:0 auto}
.lede{font-family:var(--serif);font-weight:600;font-size:clamp(18px,2.2vw,24px);line-height:2;margin:0 0 clamp(38px,6vw,62px);color:var(--green-d)}
.sec{margin:0 0 clamp(34px,5vw,52px);padding-top:28px;border-top:1px solid var(--line)}
.sec h2{font-size:11.5px;letter-spacing:.24em;color:var(--green);font-weight:700;margin:0 0 16px;position:relative;padding-left:16px}
.sec h2::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:8px;height:2px;background:var(--green)}
.sec p{font-size:15.5px;line-height:2.1;margin:0;color:var(--ink)}
.sec ul{margin:0;padding-left:1.15em}
.sec li{font-size:15px;line-height:2.05;margin-bottom:8px}
.sec li::marker{color:var(--green)}
.meta{
  display:flex;flex-wrap:wrap;gap:28px;padding:24px 26px;
  background:var(--green-l);border-radius:16px;font-size:13px;color:var(--ink);
}
.meta b{display:block;color:var(--green);font-size:10.5px;letter-spacing:.18em;font-weight:700;margin-bottom:8px}

.related{margin-top:clamp(48px,8vw,84px)}
.related h2{font-size:11.5px;letter-spacing:.24em;color:var(--green);margin:0 0 20px;font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.rcard{
  border-radius:16px;overflow:hidden;position:relative;height:132px;text-align:left;color:#fff;
  box-shadow:0 10px 24px rgba(15,60,46,.16);transition:transform .3s var(--ease), box-shadow .3s var(--ease);
}
.rcard:hover{transform:translateY(-4px);box-shadow:0 18px 34px rgba(15,60,46,.24)}
.rcard span{position:absolute;left:15px;right:15px;bottom:13px;font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.35}
.rcard i{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,26,20,.85),rgba(6,26,20,.05))}

#back{
  position:fixed;top:24px;left:26px;z-index:60;display:flex;align-items:center;gap:9px;
  background:#fff;border:1px solid var(--line);color:var(--green-d);font-weight:500;
  border-radius:999px;padding:11px 22px 11px 17px;font-size:12.5px;letter-spacing:.08em;
  box-shadow:0 8px 22px rgba(15,60,46,.18);
  opacity:0;pointer-events:none;transition:opacity .4s var(--ease) .2s, background .25s;
}
#detail.open #back{opacity:1;pointer-events:auto}
#back:hover{background:var(--green-l)}

/* ---------- 一覧 ---------- */
#listview{position:fixed;inset:0;z-index:50;background:#fff;overflow-y:auto;display:none;padding:104px clamp(24px,7vw,90px) 90px}
#listview.open{display:block}
#listview::before{content:"";position:fixed;top:0;left:0;right:0;height:5px;background:var(--band);z-index:2}
#listview h2{font-family:var(--serif);font-weight:900;font-size:30px;margin:0 0 8px;color:var(--green-d)}
#listview .lsub{font-size:12px;color:var(--muted);letter-spacing:.1em;margin:0 0 30px}
.lrow{display:flex;gap:20px;align-items:baseline;padding:22px 4px;border-top:1px solid var(--line);width:100%;text-align:left;transition:padding-left .3s var(--ease),background .3s}
.lrow:hover{padding-left:14px;background:linear-gradient(90deg,var(--green-l),rgba(255,255,255,0) 70%)}
.lrow .n{font-size:11px;color:var(--green);width:34px;flex:none;letter-spacing:.1em;font-weight:700}
.lrow .t{font-family:var(--serif);font-weight:700;font-size:20px;flex:none;color:var(--green-d)}
.lrow:hover .t{text-decoration:underline;text-decoration-color:var(--green);text-underline-offset:6px;text-decoration-thickness:2px}
.lrow .s{font-size:12.5px;color:var(--muted);line-height:1.8}
#closeList{
  position:fixed;top:24px;right:26px;z-index:60;font-size:22px;line-height:1;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--green-d);
  box-shadow:0 8px 20px rgba(15,60,46,.14);
}
#closeList:hover{background:var(--green-l)}

@media (max-width:760px){
  #brand{padding:20px 18px}
  #brand .logo{font-size:23px}
  #brand .lead{display:none}
  #nav{display:none}
  #listbtn{display:none}
  #foot{display:none}
  #dock{padding:8px 10px 8px 16px;gap:8px;bottom:18px}
  #dock .label{display:none}
  #hint{font-size:20px}
  .lrow{flex-wrap:wrap;gap:8px}
}
</style>
</head>
<body>

<div id="topband"></div>

<div id="stage"><div id="grid"></div></div>

<header class="ui" id="brand">
  <h1 class="logo" id="siteName">政策のいま<small id="siteNameEn"></small></h1>
  <p class="lead" id="siteLead"></p>
</header>

<nav class="ui" id="nav">
  <a href="#/list">ALL LIST</a>
  <a href="#/">HOME</a>
</nav>

<div class="ui" id="hint">Drag<br>to Discover</div>

<button class="ui" id="listbtn"><span class="bars"><i></i><i></i><i></i></span>ALL LIST</button>

<div class="ui" id="dock">
  <span class="label">課題の絞り込み</span>
  <div id="filters"></div>
</div>

<div class="ui" id="foot"></div>

<!-- クリック1回目に出る概要ポップアップ -->
<div id="peek"></div>

<!-- 詳細 -->
<div id="detail" aria-hidden="true">
  <div class="veil"></div>
  <div id="hero"><div class="hbg"></div><div class="hglyph"></div><div class="hshade"></div></div>
  <div id="detailScroll">
    <div class="dhead">
      <div class="in">
        <p class="sub" id="dSub"></p>
        <h1 id="dTitle"></h1>
        <div class="tags" id="dTags"></div>
      </div>
    </div>
    <div class="dbody"><div class="wrap" id="dWrap"></div></div>
  </div>
  <button id="back">← 一覧へもどる</button>
</div>

<!-- 一覧 -->
<div id="listview"><h2>政策課題 一覧</h2><p class="lsub">ALL POLICY ISSUES</p><div id="listrows"></div></div>
<button id="closeList" style="display:none">×</button>

<script src="data.js"></script>
<script>
/* ============ 基本ユーティリティ ============ */
const $ = (s,r=document)=>r.querySelector(s);
const mod = (v,m)=>((v%m)+m)%m;
const PALETTE = ["#2f6f6a","#3b5f9e","#8a4f2d","#5c6b2f","#9e3b3b","#324b7a","#4a6f8a","#a35f2b","#4f4f6b","#6b5340","#3f5c4f","#2f6b55"];
const colorOf = t => t.color || PALETTE[Math.abs([...t.id].reduce((a,c)=>a+c.charCodeAt(0),0))%PALETTE.length];
const glyphOf = t => (t.title||"").replace(/[\s・、。]/g,"").slice(0,2);
const bgStyle = t => t.image
  ? `background-image:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.15)),url('${t.image}')`
  : `background-image:radial-gradient(120% 100% at 30% 0%, ${colorOf(t)} 0%, ${shade(colorOf(t),-38)} 65%, #101012 100%)`;
function shade(hex,p){const n=parseInt(hex.slice(1),16);const f=(s)=>Math.max(0,Math.min(255,Math.round(((n>>s)&255)*(1+p/100))));return `rgb(${f(16)},${f(8)},${f(0)})`;}

$("#siteNameEn").textContent = SITE.nameEn;
$("#siteName").firstChild.textContent = SITE.name;
$("#siteLead").textContent = SITE.lead;
$("#foot").textContent = SITE.footer;
document.title = SITE.name + "｜" + SITE.owner;

/* ============ 無限グリッド ============ */
/* ---- カードの大きさ（ここを変えれば全カードのサイズが変わる） ---- */
const CARD = {
  width: 340,        // PCでのカード幅(px)
  ratio: 1.04,       // 高さ = 幅 × この値（1.30 → 1.04 で縦を約80%に）
  mobileWidth: 0.62, // スマホでは画面幅×この割合を1枚の幅にする
  gap: 22,           // カード同士の間隔(px)
};

const stage = $("#stage"), grid = $("#grid");
let CW, CH, cols, rows, gridW, gridH, tiles=[];
let ox=0, oy=0, vx=0, vy=0, dragging=false, moved=0, lastX=0, lastY=0, lastT=0;
let activeFilter = null;
let peekId = null, peekEl = null;   // 概要ポップアップの状態（loop() より先に定義しておく）
let downCard = null;                // pointerdown で押したカード

function buildGrid(){
  grid.innerHTML=""; tiles=[];
  const vw=innerWidth, vh=innerHeight;
  const narrow = vw < 760;
  CW = narrow ? Math.round(vw*CARD.mobileWidth) : CARD.width;
  CH = Math.round(CW*CARD.ratio);
  cols = Math.ceil(vw/CW)+2;
  rows = Math.ceil(vh/CH)+2;
  // テーマ数より多くのマスを作らない工夫（重複しすぎ防止）
  gridW = cols*CW; gridH = rows*CH;
  const n = THEMES.length;
  // 隣り合うカードが同じテーマにならないよう、決め打ちの並べ替え順を使う
  const ORDER = Array.from({length:n},(_,i)=>i)
    .sort((a,b)=>((a*2654435761)%n) - ((b*2654435761)%n));
  for(let c=0;c<cols;c++){
    const colShift = (c%2? CH*0.42 : 0) + (c*37 % 90);
    for(let r=0;r<rows;r++){
      const t = THEMES[ORDER[mod(c*rows + r, n)]];
      const el = document.createElement("div");
      el.className="card"; el.dataset.id=t.id;
      const gap = narrow?Math.round(CARD.gap*0.65):CARD.gap;
      const h = CH-gap-((c+r)%3===0?Math.round(CH*0.11):0);
      el.style.width=(CW-gap)+"px"; el.style.height=h+"px";
      el.innerHTML =
        `<div class="card__inner"><div class="card__bg" style="${bgStyle(t)}"></div>`+
        (t.image?"":`<div class="card__glyph">${glyphOf(t)}</div>`)+
        `<div class="card__shade"></div></div>`+
        (t.status?`<div class="card__status">${t.status}</div>`:"")+
        `<div class="card__body">`+
          (t.subtitle?`<p class="card__sub">${t.subtitle}</p>`:"")+
          `<h3 class="card__title">${t.title}</h3>`+
          `<div class="tags">${t.tags.slice(0,3).map(x=>`<span class="tag">${x}</span>`).join("")}</div>`+
        `</div>`;
      grid.appendChild(el);
      tiles.push({el,bx:c*CW,by:r*CH+colShift,theme:t});
    }
  }
  applyFilter();
  render();
}

function render(){
  for(const t of tiles){
    const x = mod(t.bx+ox+CW, gridW)-CW;
    const y = mod(t.by+oy+CH, gridH)-CH;
    t.el.style.transform = `translate3d(${x}px,${y}px,0)`;
  }
}

/* ドラッグ + 慣性 */
function down(e){
  dragging=true; moved=0; stage.classList.add("dragging");
  lastX=e.clientX; lastY=e.clientY; lastT=performance.now(); vx=vy=0;
  // どのカードを押したかをここで確定させる（setPointerCapture は click の
  // ターゲットを #stage に付け替えてしまうので使わない）
  downCard = (e.target.closest && e.target.closest(".card")) || null;
}
function move(e){
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  const now=performance.now(), dt=Math.max(1,now-lastT);
  ox+=dx; oy+=dy; moved+=Math.abs(dx)+Math.abs(dy);
  vx=dx/dt*16; vy=dy/dt*16;
  lastX=e.clientX; lastY=e.clientY; lastT=now;
  if(moved>30) $("#hint").classList.add("hide");
  if(moved>6) closePeek();
  render();
}
function up(){
  if(!dragging) return;
  dragging=false; stage.classList.remove("dragging");
  if(moved<=8) tapCard(downCard);   // 動かしていなければ「クリック」とみなす
  downCard=null;
}
function cancel(){ dragging=false; stage.classList.remove("dragging"); downCard=null; }
stage.addEventListener("pointerdown",down);
addEventListener("pointermove",move);
addEventListener("pointerup",up);
addEventListener("pointercancel",cancel);
stage.addEventListener("wheel",e=>{
  e.preventDefault(); closePeek(); ox-=e.deltaX; oy-=e.deltaY;
  $("#hint").classList.add("hide"); render();
},{passive:false});

let auto = true;
(function loop(){
  if(!dragging){
    if(Math.abs(vx)>0.05||Math.abs(vy)>0.05){
      ox+=vx; oy+=vy; vx*=0.94; vy*=0.94; render();
    }else if(auto && !peekId && !$("#detail").classList.contains("open")){
      ox-=0.18; oy-=0.10; render();
    }
  }
  requestAnimationFrame(loop);
})();

/* ============ クリック1回目＝概要ポップアップ / 2回目＝詳細ページ ============ */
const peek = $("#peek");

function openPeek(card){
  const t = THEMES.find(x=>x.id===card.dataset.id); if(!t) return;
  if(peekEl) peekEl.classList.remove("is-peek");
  peekId=t.id; peekEl=card;
  peek.innerHTML =
    `<div class="pband"></div><div class="pin">`+
    (t.subtitle?`<p class="psub">${t.subtitle}</p>`:"")+
    `<h3 class="ptitle">${t.title}</h3>`+
    `<p class="ptext">${t.summary||""}</p>`+
    `<div class="tags">${t.tags.map(x=>`<span class="tag">${x}</span>`).join("")}</div>`+
    `</div>`+
    `<div class="pmore"><div><span class="ptxt">もう一度クリックで詳しく</span>`+
    (t.status?`<em>${t.status}</em>`:"")+`</div>`+
    `<span class="btn-round">→</span></div>`;
  peek.classList.add("on");
  positionPeek(card);
  tiles.forEach(o=>o.el.classList.toggle("is-mute", o.el!==card));
  card.classList.add("is-peek");
}
function positionPeek(card){
  const r=card.getBoundingClientRect(), m=16;
  const pw=peek.offsetWidth, ph=peek.offsetHeight;
  let left = r.right + 14;
  if(left + pw > innerWidth - m) left = r.left - pw - 14;
  if(left < m) left = Math.min(Math.max(m, r.left+(r.width-pw)/2), innerWidth-pw-m);
  let top = Math.max(m, Math.min(r.top + r.height/2 - ph/2, innerHeight-ph-m));
  peek.style.left=left+"px"; peek.style.top=top+"px";
}
function closePeek(){
  if(!peekId) return;
  peek.classList.remove("on"); peekId=null;
  if(peekEl) peekEl.classList.remove("is-peek");
  peekEl=null;
  tiles.forEach(o=>o.el.classList.remove("is-mute"));
}

function tapCard(card){
  if(!card || card.classList.contains("is-dim")){ closePeek(); return; }
  if(peekId === card.dataset.id){            // 2回目 → 詳細へ
    closePeek(); location.hash = "#/t/"+card.dataset.id; return;
  }
  openPeek(card);                             // 1回目 → 概要
}
// クリック判定は pointerup（up関数）だけで行う。click を併用すると二重発火する。
peek.addEventListener("click",()=>{
  const id=peekId; closePeek(); if(id) location.hash="#/t/"+id;
});

/* ============ 絞り込み ============ */
const usedTags = [...new Set(THEMES.flatMap(t=>t.tags))];
const filters = $("#filters");
usedTags.forEach(tag=>{
  const b=document.createElement("button");
  b.className="pill"; b.textContent=tag;
  b.onclick=()=>{ activeFilter = activeFilter===tag?null:tag; syncPills(); applyFilter(); };
  filters.appendChild(b);
});
function syncPills(){ [...filters.children].forEach(b=>b.classList.toggle("on", b.textContent===activeFilter)); }
function applyFilter(){
  if(typeof closePeek==="function") closePeek();
  tiles.forEach(t=>t.el.classList.toggle("is-dim", !!activeFilter && !t.theme.tags.includes(activeFilter)));
}

/* ============ 詳細ページ ============ */
const detail=$("#detail"), hero=$("#hero");
let openedFrom=null, currentId=null;

function openTheme(id, srcEl){
  const t = THEMES.find(x=>x.id===id); if(!t) return;
  currentId = id;
  const r = srcEl ? srcEl.getBoundingClientRect()
                  : {left:innerWidth/2-160,top:innerHeight/2-200,width:320,height:400};
  openedFrom = srcEl || null;
  hero.querySelector(".hbg").style.cssText = bgStyle(t);
  hero.querySelector(".hglyph").textContent = t.image?"":glyphOf(t);
  hero.style.transition="none";
  hero.style.left=r.left+"px"; hero.style.top=r.top+"px";
  hero.style.width=r.width+"px"; hero.style.height=r.height+"px";
  hero.style.borderRadius="var(--card-r)";
  hero.offsetHeight;
  hero.style.transition="";

  $("#dSub").textContent = t.subtitle || "";
  $("#dTitle").textContent = t.title;
  $("#dTags").innerHTML = t.tags.map(x=>`<span class="tag">${x}</span>`).join("");
  const sec=(h,inner)=>inner?`<section class="sec"><h2>${h}</h2>${inner}</section>`:"";
  const others = THEMES.filter(x=>x.id!==t.id && x.tags.some(g=>t.tags.includes(g))).slice(0,4);
  $("#dWrap").innerHTML =
    `<p class="lede">${t.summary||""}</p>`+
    sec("課題の現状", t.issue?`<p>${t.issue}</p>`:"")+
    sec("岩永の考え・提案", t.stance?`<p>${t.stance}</p>`:"")+
    sec("これまでの動き", (t.actions&&t.actions.length)?`<ul>${t.actions.map(a=>`<li>${a}</li>`).join("")}</ul>`:"")+
    `<div class="meta">`+
      (t.status?`<div><b>ステータス</b>${t.status}</div>`:"")+
      (t.source?`<div><b>声のもと</b>${t.source}</div>`:"")+
      (t.updated?`<div><b>更新</b>${t.updated}</div>`:"")+
    `</div>`+
    (others.length?`<div class="related"><h2>関連する課題</h2><div class="rgrid">`+
      others.map(o=>`<button class="rcard" data-go="${o.id}" style="${bgStyle(o)}"><i></i><span>${o.title}</span></button>`).join("")+
      `</div></div>`:"");
  $("#detailScroll").scrollTop=0;

  detail.classList.add("open"); detail.setAttribute("aria-hidden","false");
  document.documentElement.style.overflow="hidden";
  requestAnimationFrame(()=>{
    hero.style.left="0px"; hero.style.top="0px";
    hero.style.width=innerWidth+"px";
    hero.style.height=Math.round(innerHeight*0.62)+"px";
    hero.style.borderRadius="0px";
  });
}

function closeTheme(){
  const r = openedFrom ? openedFrom.getBoundingClientRect() : null;
  if(r){
    hero.style.left=r.left+"px"; hero.style.top=r.top+"px";
    hero.style.width=r.width+"px"; hero.style.height=r.height+"px";
    hero.style.borderRadius="var(--card-r)";
  }
  detail.classList.remove("open"); detail.setAttribute("aria-hidden","true");
  currentId=null;
}
$("#back").onclick = ()=>{ location.hash = "#/"; };
addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(peekId){ closePeek(); return; }
  location.hash="#/";
});
$("#dWrap").addEventListener("click",e=>{
  const b=e.target.closest("[data-go]"); if(!b) return;
  location.hash="#/t/"+b.dataset.go;
});

/* ============ 一覧 ============ */
const listview=$("#listview"), closeList=$("#closeList");
$("#listrows").innerHTML = THEMES.map((t,i)=>
  `<button class="lrow" data-go="${t.id}"><span class="n">${String(i+1).padStart(2,"0")}</span>`+
  `<span class="t">${t.title}</span><span class="s">${t.summary||""}</span></button>`).join("");
$("#listrows").addEventListener("click",e=>{
  const b=e.target.closest("[data-go]"); if(!b) return;
  location.hash="#/t/"+b.dataset.go;
});
$("#listbtn").onclick=()=>{location.hash="#/list";};
closeList.onclick=()=>{location.hash="#/";};

/* ============ ルーティング ============ */
function route(){
  const h=location.hash;
  const m=h.match(/^#\/t\/(.+)$/);
  if(m){
    listview.classList.remove("open"); closeList.style.display="none";
    if(currentId!==m[1]){
      const src = [...document.querySelectorAll('.card[data-id="'+m[1]+'"]')]
        .map(el=>({el,r:el.getBoundingClientRect()}))
        .filter(o=>o.r.top<innerHeight&&o.r.bottom>0&&o.r.left<innerWidth&&o.r.right>0)[0];
      openTheme(m[1], src && src.el);
    }
    return;
  }
  if(h==="#/list"){
    if(currentId) closeTheme();
    listview.classList.add("open"); closeList.style.display="block";
    return;
  }
  listview.classList.remove("open"); closeList.style.display="none";
  if(currentId) closeTheme();
  document.documentElement.style.overflow="";
}
addEventListener("hashchange",route);

/* ============ 初期化 ============ */
buildGrid();
route();
let rt; addEventListener("resize",()=>{
  if(currentId){ hero.style.width=innerWidth+"px"; hero.style.height=Math.round(innerHeight*0.62)+"px"; }
  clearTimeout(rt);
  rt=setTimeout(()=>{const _ox=ox,_oy=oy;buildGrid();ox=_ox;oy=_oy;render();},200);
});
setTimeout(()=>$("#hint").classList.add("hide"), 6000);
</script>
</body>
</html>
